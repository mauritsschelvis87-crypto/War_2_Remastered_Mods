<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>War2 voice compare</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #12141a;
      --panel: #1c2029;
      --border: #2e3544;
      --text: #e8eaef;
      --muted: #9aa3b2;
      --vanilla: #6b9bd1;
      --enhanced: #7bc96f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px 40px;
    }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p.lead { color: var(--muted); margin: 0 0 20px; line-height: 1.5; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    select {
      width: 100%;
      max-width: 520px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 1rem;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 24px;
    }
    @media (max-width: 720px) {
      .row { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .card h2 {
      font-size: 0.95rem;
      margin: 0 0 12px;
      letter-spacing: 0.02em;
    }
    .card.vanilla h2 { color: var(--vanilla); }
    .card.enhanced h2 { color: var(--enhanced); }
    audio {
      width: 100%;
      margin-bottom: 10px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #252b36;
      color: var(--text);
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover { background: #303847; }
    button.primary {
      background: #3d4f68;
      border-color: #4d6280;
    }
    .hint {
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>
